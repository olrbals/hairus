name: HAIRUS PR verification
on:
  push:
    branches:
      - chatgpt/presentation-final-polish-1020
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: Regression tests
        run: pnpm test
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
